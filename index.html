          <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
     <h1>Student Form</h1>
 
    <form>
        <label for="name">Full name:</label>
        <input type="text" id="name" name="name" placeholder="enter your name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="enter your email" required>
        <br><br>
        <label for="password">Enter your password:</label>
        <input type="password" id="password" name="password" placeholder="choose your password" required>
        <p>Select your age:</p>
        <input type="radio" name="age" value="0-25" id="option-1">
        <label for="option-1">0-25</label>
        <input type="radio" name="age" value="26-50" id="option-2">
        <label for="option-2">26-50</label>
        <input type="radio" name="age" value="51+" id="option-3">
        <label for="option">51+</label>
        <br>
        <label for="question">Security Question</label>
        <select name="question" id="question">
            <option value="q1">What color are your favorite pair of socks?</option>
            <option value="q2">If you could become a vegetable, what will you be?</option>
            <option value="q3">What is your best ever security question</option>
        </select>
        <input type="text" id="security-question-answer" placeholder="Answer">
        <br><br>
        <label for="bio">Your bio</label><br>
        <textarea name="bio" id="bio" cols="90" rows="10" placeholder="about me..." ></textarea>


        <br><br>
        <input type="submit" value="submit the form">

    </form>




    
</body>
</html>
